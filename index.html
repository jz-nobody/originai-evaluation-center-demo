<script>
'use strict';
const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=name=>`<svg class="icon" aria-hidden="true"><use href="#i-${name}"/></svg>`;
const HEADERS=['任务id','任务名称','评测对象','数据集名称','评测规则名称','状态','评测总分','专家导购分数','体验基线分数','对话质量分数','评测报告（html）','创建人','创建时间','操作'];
const WIDTHS=[140,190,160,150,112,114,90,108,108,108,130,76,144,100];
const ITEMS=[{key:'expert',name:'专家导购评测',scoreName:'专家导购分数',dataset:'专家导购-结构化商品池 V2',rule:'专家导购评测规则',version:'v6'},{key:'baseline',name:'体验基线评测',scoreName:'体验基线分数',dataset:'体验基线-商品咨询评测集',rule:'体验基线评测规则',version:'v9'},{key:'dialogue',name:'对话质量评测',scoreName:'对话质量分数',dataset:'对话质量-多轮对话评测集',rule:'对话质量评测规则',version:'v4'}];
const SPECS=[{id:'46074',name:'ShoppingAgent 1104 全项评测',version:'v46',creator:'锦舟',time:'2026/11/04 16:12:33',statuses:['success','success','success'],scores:[88.6,91.2,86.4],total:88.73},{id:'46047',name:'ShoppingAgent 策略 B 评测',version:'v45',creator:'锦舟',time:'2026/11/04 16:11:02',statuses:['success','success','success'],scores:[82.5,87.8,84.2],total:84.83},{id:'45220',name:'双十一导购体验回归',version:'v46',creator:'锦舟',time:'2026/11/04 15:02:05',statuses:['success','running','waiting'],scores:[86.2,null,null],total:null},{id:'45121',name:'多轮购物咨询评测',version:'v44',creator:'锦舟',time:'2026/11/04 14:53:27',statuses:['success','success','failed'],scores:[79.6,82.8,null],total:null},{id:'44798',name:'新客导购承接质量评测',version:'v43',creator:'云禾',time:'2026/11/03 17:30:12',statuses:['success','success','success'],scores:[78.4,85.6,81.9],total:81.97},{id:'44762',name:'家电选购：预算约束与连续追问场景专项评测',version:'v42',creator:'青川',time:'2026/11/03 14:20:08',statuses:['success','success','success'],scores:[84.1,89.5,86.7],total:86.77}];
const TASKS=SPECS.map((s,index)=>({...s,object:'qwenShoppingAgent',spe:'SPE 实验 A',mode:'离线',children:ITEMS.map((it,i)=>({id:String(Number(s.id)*10+i+1),parentId:s.id,item:it.key,name:it.name,object:'qwenShoppingAgent',version:s.version,spe:'SPE 实验 A',creator:s.creator,time:s.time,status:s.statuses[i],score:s.scores[i],dataset:{id:String(10364+index*3+i),name:`${index<2?'1105':index<4?'1104':'1103'}@${[2000,1000,800][i]}样本`,version:it.version,count:[2000,1000,800][i]},rule:{id:String(51011+i*10),name:it.rule,version:['rules2.0','rules2.1','rules1.8'][i]},samples:s.statuses[i]==='success'?[2000,1000,800][i]:s.statuses[i]==='running'?Math.round([2000,1000,800][i]*.62):0}))}));
let filters={query:'',status:'',creator:'',mine:false},formState={...filters},page=1,pageSize=5,expanded=new Set(['46074']),tableX=0,tableY=0,lastModalFocus=null,toastTimer=null,density='compact',sortOrder='newest';
const STATUS={success:{label:'已完成',cls:'success'},running:{label:'评测中',cls:'running'},waiting:{label:'待执行',cls:'waiting'},failed:{label:'执行失败',cls:'failed'}};
function parentStatus(t){if(t.children.some(c=>c.status==='running'||c.status==='waiting'))return 'running';if(t.children.some(c=>c.status==='failed'))return 'failed';return 'success'}
function locate(id){for(const t of TASKS){if(t.id===id)return {task:t,parent:null};const c=t.children.find(v=>v.id===id);if(c)return {task:c,parent:t}}return null}
function score(v,total=false){return v===null||v===undefined?'<span class="no-score" title="尚无可用分数">—</span>':`<span class="score ${total?'total':''}">${Number(v).toFixed(2)}</span>`}
function badge(status){const s=STATUS[status];return `<span class="badge ${s.cls}">${s.label}</span>`}
function stateCell(t,parent=false){const status=parent?parentStatus(t):t.status;const meta=parent?`${t.children.filter(c=>c.status==='success').length}/3 项完成`:status==='failed'?'模型调用超时':status==='waiting'?'等待执行资源':`${t.samples}/${t.dataset.count} 样本`;return badge(status)+`<span class="cell-meta">${meta}</span>`+(status==='running'&&!parent?`<div class="progress" role="progressbar" aria-label="完成进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(t.samples/t.dataset.count*100)}"><div class="progress-fill" style="width:${Math.round(t.samples/t.dataset.count*100)}%"></div></div>`:'')}
function canReport(t,parent=false){return (parent?parentStatus(t):t.status)==='success'}
function reportLink(t,parent=false){return canReport(t,parent)?`<a class="report-link" href="#/tasks/${t.id}/report">${icon('file')}查看报告</a><div class="report-format">HTML · ${parent?'综合报告':'单项报告'}</div>`:`<span class="cell-meta">${(parent?parentStatus(t):t.status)==='failed'?'暂不可用':'待生成'}</span>`}
function filteredTasks(ignoreStatus=false){const q=filters.query.trim().toLowerCase();return TASKS.filter(t=>{const textMatch=!q||(/^\d+$/.test(q)?t.id===q||t.children.some(c=>c.id===q):t.name.toLowerCase().includes(q)||t.children.some(c=>c.name.toLowerCase().includes(q)));return textMatch&&(ignoreStatus||!filters.status||parentStatus(t)===filters.status)&&(!filters.creator||t.creator===filters.creator)&&(!filters.mine||t.creator==='锦舟')}).sort((a,b)=>sortOrder==='newest'?b.time.localeCompare(a.time):a.time.localeCompare(b.time))}
function syncListControls(){const candidates=filteredTasks(true);document.querySelectorAll('[data-status]').forEach(b=>{const s=b.dataset.status,active=filters.status===s;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active));b.querySelector('.status-count').textContent=s?candidates.filter(t=>parentStatus(t)===s).length:candidates.length});$('clearSearch').hidden=!$('searchInput').value;const labels={query:'搜索',status:'状态',creator:'创建人',mine:'我的任务'};const entries=Object.entries(filters).filter(([,v])=>Boolean(v));$('filterChips').hidden=!entries.length;$('filterChips').innerHTML=entries.length?'<span class="filter-chips-label">已筛选</span>'+entries.map(([k,v])=>`<button class="filter-chip" data-remove-filter="${k}" aria-label="移除${labels[k]}筛选"><span>${k==='mine'?'我的任务':`${labels[k]}：${esc(k==='status'?STATUS[v].label:v)}`}</span>${icon('close')}</button>`).join(''):'';syncColumnPosition()}
function syncColumnPosition(){if(!$('tableScroll'))return;const el=$('tableScroll'),limit=el.scrollWidth-el.clientWidth,key=el.scrollLeft<200?'start':el.scrollLeft>=limit-40?'end':'scores';document.querySelectorAll('[data-scroll]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.scroll===key)))}
function applyFilters(){saveForm();filters={...formState};page=1;tableX=0;tableY=0;const q=filters.query.trim();if(q)TASKS.forEach(t=>{if(t.children.some(c=>c.id===q||c.name.toLowerCase().includes(q.toLowerCase())))expanded.add(t.id)});renderTable();$('live').textContent=`查询完成，共 ${filteredTasks().length} 个父任务`}
function notify(text){clearTimeout(toastTimer);$('toast').textContent=text;$('toast').hidden=false;toastTimer=setTimeout(()=>{$('toast').hidden=true},2500)}
function listHTML(){return `<div class="crumb"><span>评测中心</span><span>/</span><span>评测任务</span></div>${lastCreatedId?`<div class="new-task-notice"><span><strong>新任务已创建</strong> · ${esc(locate(lastCreatedId)?.task.name||'')} · 三项子任务已加入列表</span><a href="#/tasks/${lastCreatedId}">查看任务 ${lastCreatedId} →</a></div>`:''}<div class="page-title"><div><div class="title-line"><h1 id="pageHeading" tabindex="-1">评测任务</h1><span class="page-total">${TASKS.length}</span></div><p class="subtitle">从综合任务到单项结果，一处查看进度、评分与报告</p></div><div class="page-actions"><span class="demo-tag"><span class="demo-dot"></span>模拟演示</span><button class="btn primary" id="newEvaluation"><span aria-hidden="true">＋</span>新建评测</button></div></div><section class="panel task-workspace" aria-label="评测任务工作区"><div class="workspace-top"><nav id="statusQuick" class="status-quick" aria-label="按任务状态筛选">${['','running','success','failed'].map(s=>`<button class="status-tab ${filters.status===s?'active':''}" data-status="${s}" aria-pressed="${filters.status===s}"><span>${s?STATUS[s].label:'全部任务'}</span><span class="status-count">${s?TASKS.filter(t=>parentStatus(t)===s).length:TASKS.length}</span></button>`).join('')}</nav><button class="btn small" id="refreshList">${icon('refresh')}刷新</button></div><div class="filter-panel"><form id="filterForm" class="filter-form"><div class="field search"><label for="searchInput">任务 ID / 任务名称</label><div class="search-wrap">${icon('search')}<input id="searchInput" class="input" value="${esc(formState.query)}" placeholder="完整 ID 或名称关键词" autocomplete="off"><button id="clearSearch" type="button" class="clear-search" aria-label="清空任务搜索" ${formState.query?'':'hidden'}>${icon('close')}</button></div></div><div class="field"><label for="statusFilter">状态</label><select id="statusFilter" class="input"><option value="">全部状态</option>${['running','success','failed'].map(s=>`<option value="${s}" ${formState.status===s?'selected':''}>${STATUS[s].label}</option>`).join('')}</select></div><div class="field"><label for="creatorFilter">创建人</label><select id="creatorFilter" class="input"><option value="">全部创建人</option>${['锦舟','云禾','青川'].map(n=>`<option ${formState.creator===n?'selected':''}>${n}</option>`).join('')}</select></div><div class="filter-actions"><button class="btn primary" type="submit">查询</button><button class="btn" type="button" id="resetFilter">重置</button></div><label class="mine"><input id="mineFilter" type="checkbox" ${formState.mine?'checked':''}>我的任务</label></form><div class="filter-chips" id="filterChips" aria-label="已应用筛选" hidden></div></div><div class="table-toolbar"><div class="toolbar-title"><h2>任务列表</h2><span class="count" id="taskCount"></span></div><div class="toolbar-actions"><label class="sort-label" for="sortSelect">排序</label><select id="sortSelect" class="input sort-select">${[['newest','最新创建'],['oldest','最早创建']].map(([v,n])=>`<option value="${v}" ${sortOrder===v?'selected':''}>${n}</option>`).join('')}</select><div class="density-control" role="group" aria-label="行间距"><button class="density-btn ${density==='compact'?'active':''}" data-density="compact" aria-pressed="${density==='compact'}">紧凑</button><button class="density-btn ${density==='comfortable'?'active':''}" data-density="comfortable" aria-pressed="${density==='comfortable'}">舒适</button></div><button class="text-btn" id="expandAll">展开全部</button></div></div><div class="column-tools"><span class="table-hint">${icon('info')}箭头展开三项评测 · 点击 ID 查看详情</span><div class="column-nav" aria-label="表格列导航"><button class="column-btn" data-scroll="start" aria-pressed="true">任务与配置</button><button class="column-btn" data-scroll="scores" aria-pressed="false">分数与报告</button><button class="column-btn" data-scroll="end" aria-pressed="false">创建信息</button></div></div><div class="table-scroll" id="tableScroll" data-density="${density}" role="region" aria-label="可横向滚动的评测任务列表" tabindex="0"></div><div class="table-footer" id="tableFooter"></div></section><p class="footnote">父子任务共用 14 个字段；分页按父任务计数。“—”为未完成或不适用，非 0 分。所有分数与报告为模拟数据。</p>`}
function rowHTML(t,parent){const scores=parent?ITEMS.map(it=>t.children.find(c=>c.item===it.key)?.score):ITEMS.map(it=>t.item===it.key?t.score:null);const idCell=parent?`<button class="expand" data-expand="${t.id}" aria-label="${expanded.has(t.id)?'收起':'展开'}任务 ${t.id} 的子任务" aria-expanded="${expanded.has(t.id)}" aria-controls="children-${t.id}">${icon('chevron')}</button>`:'<span class="branch" aria-hidden="true"></span>';const datasets=parent?[...new Set(t.children.map(c=>c.dataset.name))]:[t.dataset.name];const rules=parent?[...new Set(t.children.map(c=>c.rule.version))]:[t.rule.version];return `<tr class="${parent?'parent':'child'}-row ${parent&&expanded.has(t.id)?'is-expanded':''}" data-row="${t.id}"><td class="fixed-id"><div class="id-cell">${idCell}<a class="id-link" href="#/tasks/${t.id}" aria-label="查看${parent?'任务':'子任务'} ${t.id} 详情">${t.id}</a></div></td><td><span class="${parent?'cell-title task-name':'child-name'}" title="${esc(t.name)}">${esc(t.name)}${!parent?'<span class="task-kind">子任务</span>':''}</span>${parent?`<span class="cell-meta">${esc(t.mode||'离线')} · 3 项评测</span>`:''}</td><td><span class="cell-title object-name" title="${esc(t.object)}">${esc(t.object)}</span><span class="cell-meta">${esc(t.version)} · ${esc(t.spe)}</span></td><td class="name-only dataset-name">${datasets.map(n=>`<span title="${esc(n)}">${esc(n)}</span>`).join('')}</td><td class="name-only rule-name">${rules.map(n=>`<span title="${esc(n)}">${esc(n)}</span>`).join('')}</td><td>${stateCell(t,parent)}</td><td class="number-cell total-cell">${parent?score(parentStatus(t)==='success'?t.total:null,true):'<span class="no-score" title="子任务不展示综合总分">—</span>'}</td>${scores.map(v=>`<td class="number-cell">${score(v)}</td>`).join('')}<td>${reportLink(t,parent)}</td><td class="creator-name">${esc(t.creator)}</td><td><div class="time">${esc(t.time.split(' ')[0])}<br>${esc(t.time.split(' ')[1])}</div></td><td class="fixed-action"><div class="operations"><a href="#/tasks/${t.id}">详情</a>${parent?`<button class="text-btn" data-expand="${t.id}" aria-label="${expanded.has(t.id)?'收起':'展开'}子任务">${expanded.has(t.id)?'收起':'展开'}子任务</button>`:`<button class="text-btn" data-config="${t.id}:all">查看配置</button>`}</div></td></tr>`}
function captureList(){if(!$('tableScroll'))return;tableX=$('tableScroll').scrollLeft;tableY=$('tableScroll').scrollTop}
function renderTable(){const filtered=filteredTasks();const max=Math.max(1,Math.ceil(filtered.length/pageSize));page=Math.min(page,max);const current=filtered.slice((page-1)*pageSize,page*pageSize);$('taskCount').textContent=`${filtered.length} 个父任务 · ${filtered.length*3} 个子任务`;$('expandAll').textContent=current.length&&current.every(t=>expanded.has(t.id))?'收起全部':'展开全部';$('expandAll').disabled=current.length===0;if(!current.length){$('tableScroll').innerHTML=`<div class="empty">${icon('search')}<strong>没有符合条件的任务</strong><p>试试完整任务 ID，或调整状态与创建人筛选。</p><button class="btn" id="emptyReset">清空筛选</button></div>`}else{$('tableScroll').innerHTML=`<table id="taskTable"><caption>评测任务及三类评测子任务，共14列</caption><colgroup>${WIDTHS.map(w=>`<col style="width:${w}px">`).join('')}</colgroup><thead><tr>${HEADERS.map((h,i)=>`<th scope="col" class="${i===0?'fixed-id':i===13?'fixed-action':''}">${esc(h)}</th>`).join('')}</tr></thead>${current.map(t=>`<tbody>${rowHTML(t,true)}</tbody><tbody id="children-${t.id}" ${expanded.has(t.id)?'':'hidden'} aria-label="任务 ${t.id} 的三项子任务">${t.children.map(c=>rowHTML(c,false)).join('')}</tbody>`).join('')}</table>`}$('tableFooter').innerHTML=`<span>${filtered.length?`显示第 ${(page-1)*pageSize+1}–${Math.min(page*pageSize,filtered.length)} 个父任务，共 ${filtered.length} 个`: '共 0 个父任务'}</span><div class="pagination"><label class="sr-only" for="pageSize">每页父任务数量</label><select class="input" id="pageSize">${[5,10,20].map(n=>`<option value="${n}" ${n===pageSize?'selected':''}>${n} 条/页</option>`).join('')}</select><button class="page-btn" data-page="${page-1}" aria-label="上一页" ${page===1?'disabled':''}>${icon('arrow')}</button>${Array.from({length:max},(_,i)=>`<button class="page-btn ${page===i+1?'selected':''}" data-page="${i+1}" aria-label="第 ${i+1} 页" ${page===i+1?'aria-current="page"':''}>${i+1}</button>`).join('')}<button class="page-btn" data-page="${page+1}" aria-label="下一页" ${page===max?'disabled':''}><svg class="icon" style="transform:rotate(180deg)" aria-hidden="true"><use href="#i-arrow"/></svg></button></div>`;$('tableScroll').scrollLeft=tableX;$('tableScroll').scrollTop=tableY;syncListControls()}
function toggleExpand(id){captureList();const open=!expanded.has(id);if(open)expanded.add(id);else expanded.delete(id);const group=$('children-'+id);if(group)group.hidden=!open;document.querySelector(`tr[data-row="${id}"]`)?.classList.toggle('is-expanded',open);document.querySelectorAll(`[data-expand="${id}"]`).forEach(b=>{if(b.classList.contains('expand')){b.setAttribute('aria-expanded',String(open));b.setAttribute('aria-label',`${open?'收起':'展开'}任务 ${id} 的子任务`)}else{b.textContent=open?'收起子任务':'展开子任务';b.setAttribute('aria-label',open?'收起子任务':'展开子任务')}});const current=filteredTasks().slice((page-1)*pageSize,page*pageSize);$('expandAll').textContent=current.every(t=>expanded.has(t.id))?'收起全部':'展开全部';$('live').textContent=`已${open?'展开':'收起'}任务 ${id} 的三项子任务`}
function scoreCard(label,value,featured=false,meta=''){return `<div class="score-card ${featured?'featured':''}"><div class="info-label">${label}</div><div class="big-score">${value===null||value===undefined?'—':Number(value).toFixed(2)}<small>${value===null||value===undefined?'暂未产出':'/ 100'}</small></div><span class="cell-meta">${esc(meta)}</span></div>`}

function detailHTML(t,parent,tab='overview'){if(tab==='samples'||tab==='machine')return resultsPageHTML(t,parent,tab);const isParent=!parent,status=isParent?parentStatus(t):t.status,owner=parent||t,children=isParent?t.children:[t];const crumbs=`<div class="crumb"><a href="#/tasks">评测任务</a><span>/</span>${parent?`<a href="#/tasks/${parent.id}">${parent.id}</a><span>/</span>`:''}<span>${t.id}</span></div>`;const head=`<div class="details-top"><div><div class="detail-heading"><h1 id="pageHeading" tabindex="-1">${esc(t.name)}</h1>${badge(status)}<span class="task-kind">${isParent?'父任务':'子任务'}</span></div><p class="task-id-title">任务 ID ${t.id}${parent?` · 所属任务 <a href="#/tasks/${parent.id}">${parent.id}</a>`:' · 三项评测统一汇总'}</p></div><div class="filter-actions"><a class="btn" href="#/tasks">${icon('arrow')}返回任务列表</a>${canReport(t,isParent)?`<a class="btn primary" href="#/tasks/${t.id}/report">${icon('file')}查看 HTML 报告</a>`:''}</div></div>`;const info=`<section class="panel detail-info" aria-label="任务基本信息"><div><div class="info-label">评测对象</div><div class="info-value">${esc(t.object)}<span class="cell-meta">${esc(t.version)} · ${esc(t.spe)}</span></div></div><div><div class="info-label">评测模式</div><div class="info-value">${esc((owner.mode||'离线')+'评测')}<span class="cell-meta">${isParent?`3 项评测 · ${t.children.reduce((sum,c)=>sum+c.dataset.count,0)} 条样本`:`${t.dataset.count} 条样本 · 完成 ${t.samples} 条`}</span></div></div><div><div class="info-label">创建人</div><div class="info-value">${esc(t.creator)}</div></div><div><div class="info-label">创建时间</div><div class="info-value">${esc(t.time)}</div></div></section>`;const scoresHTML=isParent?`<section class="score-grid" aria-label="任务评测分数">${scoreCard('评测总分',status==='success'?t.total:null,true,'综合结果 · 模拟值')}${ITEMS.map(it=>{const c=t.children.find(c=>c.item===it.key);return scoreCard(it.scoreName,c.score,false,STATUS[c.status].label)}).join('')}</section>`:`<section class="score-grid" aria-label="子任务评测分数">${scoreCard(ITEMS.find(it=>it.ke let wizardMode='offline',wizardStep=1,wizardDrafts={offline:blankWizard(),online:blankWizard()},wizardErrors={},prechecking=false,submitting=false,precheckTimer=null,submitTimer=null,nextTaskId=47000,nextDatasetId=62000,lastCreatedId=null;

function datasetStepHTML(d){const done=d.job?.status==='done'||d.datasets.length>0;const running=d.job?.status==='running';if(done||running)return datasetOutputHTML(d);return `<div class="section-heading"><div><h2>数据集创建</h2><p class="subtitle">在当前任务内生成样本集，完成后继续配置评测规则。</p></div><span class="demo-tag">${wizardMode==='offline'?'离线评测':'在线评测'}</span></div><div class="mining-form"><span class="wizard-label">创建方式</span><div class="source-grid" role="radiogroup" aria-label="创建评测集的方式">${W_SOURCES.map(s=>`<label class="source-card"><input type="radio" name="wSource" value="${s.id}" ${d.source===s.id?'checked':''}><span class="source-title">${icon(s.icon)}${s.name}</span><span class="source-caption">${s.description}</span></label>`).join('')}</div>${wInput('wDatasetName','数据集名称',d.datasetName,'例如：1105@2000样本',true,'maxlength="100" data-wiz="datasetName"')}${d.source==='agent'?`<div class="agent-intro"><div class="agent-mark">${icon('skill')}</div><div><div class="agent-intro-title">告诉 Agent，你想挖掘什么数据</div><p class="help">描述数据范围和筛选要求，Agent 将自动生成评测样本集。</p></div></div><div class="label-row"><label class="wizard-label required" for="wPrompt">数据挖掘 Prompt</label><button class="text-btn" data-waction="fillMining">填入示例</button></div><div class="prompt-frame"><textarea id="wPrompt" maxlength="5000" data-wiz="prompt" aria-describedby="wPromptError" aria-invalid="${Boolean(wizardErrors.wPrompt)}" placeholder="例如：从近7天 ShoppingAgent 对话中抽取2000条商品咨询，覆盖预算约束、商品对比和多轮追问。">${esc(d.prompt)}</textarea><div class="prompt-meta"><span>支持自然语言描述</span><span id="wPromptCount">${d.prompt.length} / 5000</span></div></div>${wError('wPrompt')}<div class="prompt-hints"><span>建议包含</span><span class="hint-tag">数据范围</span><span class="hint-tag">筛选条件</span><span class="hint-tag">样本数量</span><span class="hint-tag">配置名称</span></div><div class="split-block"><div class="split-line"><div><div class="split-text">是否拆分3项评测</div><p class="help" id="wSplitHelp">${d.split?'分别生成三个独立的数据集。':'生成一个完整样本集，供三个评测项共同使用。'}</p></div><but function importStepHTML(d){return `<div class="template-line" role="radiogroup" aria-label="数据字段配置"><label><input type="radio" name="wTemplate" value="default" ${d.template==='default'?'checked':''}>默认模板</label><label><input type="radio" name="wTemplate" value="existing" ${d.template==='existing'?'checked':''}>原有配置</label></div><p class="dataset-preview-note">导入 chatid、traceid、userid 字段。当前为模拟演示，不解析真实文件，也不连接 ODPS。</p>${d.source==='excel'?`<div class="upload-zone">${icon('file')}<strong>选择已有 Excel 样本文件</strong><p>.xlsx / .xls，不超过 20 MB</p><button class="btn" data-waction="chooseFile">选择 Excel 文件</button><input id="wExcelFile" type="file" accept=".xlsx,.xls" hidden><span id="wFileName">${d.file?esc(d.file.name):'尚未上传文件'}</span></div>${wError('wExcelFile')}<p class="help">文件名仅用于展示，预览使用 2 条模拟样本，不上传文件内容。</p>`:`<div class="wizard-field"><label class="wizard-label required" for="wSql">取数 SQL（模拟）</label><textarea id="wSql" class="input" data-wiz="odpsSql" aria-describedby="wSqlError" placeholder="SELECT chatid, traceid, userid FROM your_table ...">${esc(d.odpsSql)}</textarea>${wError('wSql')}</div>`}<div class="send-row" style="margin-top:20px"><button class="btn" data-waction="previewImport">导入并预览字段</button><button class="btn primary" data-waction="saveImport" ${d.importReady?'':'disabled'}>保存数据集</button></div>${d.importReady?`<div class="import-preview"><strong>模拟字段预览</strong><div style="overflow:auto"><table class="mini-preview"><caption>模拟导入字段预览</caption><thead><tr><th>chatid</th><th>traceid</th><th>userid</th></tr></thead><tbody><tr><td>demo_chat_001</td><td>demo_trace_001</td><td>demo_user_001</td></tr><tr><td>demo_chat_002</td><td>demo_trace_002</td><td>demo_user_002</td></tr></tbody></table></div><p>2 条模拟样本，保存后供三个评测项共同使用。</p></div>`:''}`}
function datasetOutputHTML(d){const j=d.job,running=j?.status==='running';return `<div class="section-heading"><div><h2>数据集创建</h2><p class="subtitle">${running?'Agent 正在产出评测样本集':'评测样本集已就绪，可进入评测规则配置'}</p></div>${running?'<span class="badge running">产出中</span>':'<span class="badge success">上传完成</span>'}</div><div class="generation-head"><div class="generation-title"><span class="agent-mark">${icon(d.source==='agent'?'skill':'file')}</span><div><h3>${running?'Agent 正在生成数据':'数据集已创建'}</h3><p class="help">${d.source==='agent'?'Agent 挖掘':d.source==='excel'?'本地 Excel':'ODPS'} · ${wizardMode==='offline'?'离线评测':'在线评测'} · ${d.datasets.length} 个数据集 · 模拟演示</p></div></div>${running?'<button class="btn" data-waction="stopMining">停止产出</button>':'<button class="btn" data-waction="regenerate">重新创建数据集</button>'}</div>${d.source==='agent'?`<div class="submitted-prompt">${esc(j?.prompt||d.prompt)}</div>`:''}${d.source==='agent'?`<div class="generation-progress"><div class="generation-label"><strong id="generationStage">${running?'理解需求':'已完成生成和导入'}</strong><span id="generationPercent">${j?.percent||100}%</span></div><div class="wide-progress" role="progressbar" aria-label="Agent 数据集生成进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${j?.percent||0}"><span id="generationFill" style="width:${j?.percent||100}%"></span></div><div class="generation-stages">${['理解需求','检索与采样',wizardMode==='offline'?'回放与清洗':'清洗已有结果','生成与导入'].map((s,i)=>`<div class="generation-stage ${running?'':'done'}" data-stage="${i}"><span class="stage-dot">${i+1}</span>${s}</div>`).join('')}</div></div>`:''}<div class="generated-table-wrap"><table class="generated-table"><caption>当前任务生成的评测数据集</caption><colgroup><col style="width:150px"><col><col style="width:90px"><col style="width:120px"><col style="width:80px"></colgroup><thead><tr><th>对应评测项</th><th>数据集名称</th><th>样本量</th><th>状态</th><th>操作</th></tr></thead><tbody>${d.datasets.map(r=>`<tr data-generated="${r.id}"><td>${r.item?esc(W_ITEMS.find(it=>it.key===r.item).na function resultTabsHTML(id,tab){return `<nav class="detail-tabs ${tab==='samples'||tab==='machine'?'results-tabs':''}" aria-label="任务详情页面导航">${[['overview','概览'],['machine','机评'],['samples','Case'],['report','报告'],['config','配置']].map(([key,label])=>`<a class="detail-tab ${key===tab?'active':''}" href="#/tasks/${id}/${key}" data-tab="${key}" ${key===tab?'aria-current="page"':''}>${label}</a>`).join('')}</nav>`}
function resultPill(label,cls=''){return `<span class="result-pill ${cls}">${esc(label)}</span>`}
function seedChildRecords(c){if(resultRecordCache.has(c.id))return resultRecordCache.get(c.id);const count=Math.min(6,c.dataset.count),queries=['预算5000元，想买一台适合家用的冰箱。','上一轮推荐的两款手机，哪款拍照更好？','我更看重售后和节能，有没有其他推荐？','沿用上一轮预算，再比较这两款商品。','想给父母买一台操作简单的手机。','这个商品是否适合日常通勤？'];const list=Array.from({length:count},(_,i)=>({id:String(Number(c.id)*100+i+1),childId:c.id,index:i,executionId:String(Number(c.id)*100+900+i),attempt:1,rounds:i===3?5:1,duration:[13.3,14.2,3,51.9,8.6,11.5][i],trace:`demo_21365e${c.id}${i+1}10082058341e199e`,baseScore:[100,25,75,25,100,40][i],baseConclusion:i===5?'fail':'pass',rerunning:false,ratedAgain:false,query:queries[i],answer:'根据你的预算和使用场景，建议比较商品的核心参数、售后保障及真实使用评价，并保留前序对话中的偏好限制。',attempts:[{number:1,reason:'初始模拟机评 Attempt；执行状态以当前记录为准。'}]}));resultRecordCache.set(c.id,list);return list}
function resultRecordsFor(t,parent){return (parent?[t]:t.children).flatMap(c=>seedChildRecords(c))}
function resultView(){const route=parseRoute();if(!route?.id||!['samples','machine'].includes(route.tab))return null;const hit=locate(route.id);if(!hit)return null;const key=`${route.id}:${route.tab}`;if(!resultViewStates.has(key))resultViewStates.set(key,{human:'',conclusion:'',status:'',query:'',applied:{human:'',conclusion:'',status:'',query:''},page:1,size:10,selected:new Set(),x:0,y:0});return {...hit,route,state:resultViewStates.get(key),records:resultRecordsFor(hit.task,hit.parent)}}
function recordFacts(r){const hit=locate(r.childId),c=hit.task,p=hit.parent;const done=c.status==='success'||c.samples>r.index;const tested=c.status==='failed'?'failed':done?'success':c.status==='waiting'?'waiting':'running';const machine=r.rerunning?'running':tested==='success'?'success':tested;const humanNeeded=p?.creation&&p.creation.workflow!=='machine';const human=humanNeeded?(machine==='success'?'done':'pending'):'none';const conclusion=machine==='success'?r.baseConclusion:'uncertain';return {c,p,tested,machine,human,conclusion,score:machine==='success'?r.baseScore:null}}
function technicalPill(status){return status==='success'?resultPill('成功','green'):status==='failed'?resultPill('失败','red'):status==='running'?resultPill('进行中','blue'):resultPill('待执行','orange')}
function conclusionPill(value){return value==='pass'?resultPill('通过','green'):value==='fail'?resultPill('未通过','red'):resultPill('不确定')}
function humanPill(value){return value==='none'?resultPill('无需人评'):value==='done'?resultPill('已完成','green'):resultPill('待人评','orange')}
function resultSelect(id,value,options){return `<select class="input" id="${id}">${options.map(([v,n])=>`<option value="${v}" ${value===v?'selected':''}>${n}</option>`).join('')}</select>`}
function resultsPageHTML(t,parent,tab){const key=`${t.id}:${tab}`;if(!resultViewStates.has(key))resultViewStates.set(key,{human:'',conclusion:'',status:'',query:'',applied:{human:'',conclusion:'',status:'',query:''},page:1,size:10,selected:new Set(),x:0,y:0});const state=resultViewStates.get(key),records=resultRecordsFor(t,parent),content=resultsTableHTML(records,state,tab);return `<section class="results-page"><div class="crumb"><a href="#/tasks">评测任务</a><span>/</span>${parent?`<a href="#/tasks/${parent.id}">${parent.id}</a><span>/</span>`:''}<span>${t.id}</span></div><div class="results-heading"><div><h1 id="pageHeading" tabindex="-1">${esc(t.name)}</h1><p class="subtitle">技术成功不代表质量通过；人评待完成会阻止最终报告。</p></div><div class="filter-actions"><button class="btn" id="rRefresh">刷新</button><a class="btn" href="#/tasks">返回任务列表</a></div></div>${resultTabsHTML(t.id,tab)}<form class="results-filter" id="rFilterForm">${tab==='samples'?`<label for="rHuman">人评状态：${resultSelect('rHuman',state.human,[['','全部'],['none','无需人评'],['pending','待人评'],['done','已完成']])}</label><label for="rConclusion">最终结论：${resultSelect('rConclusion',state.conclusion,[['','全部'],['pass','通过'],['fail','未通过'],['uncertain','不确定']])}</label>`:`<label class="search-label" for="rQuery">记录 ID：<input class="input result-search" id="rQuery" placeholder="完整记录 ID" value="${esc(state.query)}" autocomplete="off"></label><label for="rStatus">执行状态：${resultSelect('rStatus',state.status,[['','全部'],['success','成功'],['failed','失败'],['running','进行中'],['waiting','待执行']])}</label>`}<button class="btn primary" type="submit">查询</button><button class="btn" id="rReset" type="button">重置</button></form><div class="result-meta-line"><span>${parent?'当前单项评测':'主任务下三项评测'} · 仅展示 ${records.length} 条模拟样本记录</span><span class="results-selection" id="rSelectionCount"></span></div><section class="results-panel"><div class="results-scroll" id="rScroll" tabindex="0" role="region" aria-label="${tab==='samples'?'Case 结果':'机评执行记录'}可横向滚动列表">${content.table}</div><div class="results-footer" id="rFooter">${content.footer}</div></section><p class="results-note">${tab==='machine'?'机评页记录执行状态与逐轮证据；重评机评只更新此 Demo 的样本示例，不重新执行被测 Agent，不修改任务汇总分或已生成报告。':'Case 页按样本展示执行状态、机器结论、人工状态与最终评分；分数保留 6 位小数。'}所有 ID、Trace 和证据均为模拟。</p></section>`}
function filteredResultRecords(records,state,tab){const a=state.applied;return records.filter(r=>{const f=recordFacts(r);return tab==='samples'?(!a.human||f.human===a.human)&&(!a.conclusion||f.conclusion===a.conclusion):(!a.query||r.id===a.query.trim())&&(!a.status||f.machine===a.status)})}
function caseRowHTML(r){const f=recordFacts(r);return `<tr data-result-record="${r.id}"><td class="result-number">${r.id}</td><td>${technicalPill(f.tested)}</td><td>${technicalPill(f.machine)}</td><td>${conclusionPill(f.conclusion)}</td><td>${humanPill(f.human)}</td><td>${conclusionPill(f.conclusion)}</td><td class="result-number result-score">${f.score===null?'—':Number(f.score).toFixed(6)}</td><td class="result-action-cell"><button class="text-btn" data-r-evidence="${r.id}">查看证据</button></td></tr>`}
function machineRowHTML(r,state){const f=recordFacts(r);return `<tr data-result-record="${r.id}"><td><input type="checkbox" data-r-select="${r.id}" aria-label="选择记录 ${r.id}" ${state.selected.has(r.id)?'checked':''}></td><td class="result-number">${r.id}</td><td class="result-number">${r.executionId}</td><td class="host-cell"><div class="host-line"><span title="agent:${esc(f.c.object)}">agent:${esc(f.c.object)}</span><span class="host-version">${esc(f.c.version)}</span></div></td><td class="result-number">${r.attempt}</td><td><div class="state-round">${technicalPill(f.machine)}<span class="result-row-meta">${f.machine==='success'?`${r.rounds}/${r.rounds}`:`0/${r.rounds}`} 轮</span></div></td><td class="result-number">${['running','waiting'].includes(f.machine)?'—':r.duration.toFixed(1)+'s'}</td><td><span class="result-failure">${f.machine==='failed'?'模型调用超时':'—'}</span></td><td><button class="trace-button" title="${esc(r.trace)}" aria-label="查看 Trace ${r.id}" data-r-trace="${r.id}">${esc(r.trace)}</button></td><td class="result-action-cell"><button class="text-btn result-menu-trigger" data-r-menu="${r.id}" aria-haspopup="menu" aria-expanded="false" aria-controls="resultActionMenu">操作 ${icon('chevron')}</button></td></tr>`}
function resultsTableHTML(records,state,tab){const rows=filteredResultRecords(records,state,tab),max=Math.max(1,Math.ceil(rows.length/state.size));state.page=Math.min(state.page,max);const current=rows.slice((state.page-1)*state.size,state.page*state.size),machine=tab==='machine',headers=machine?MACHINE_COLUMNS:CASE_COLUMNS,widths=machine?[42,115,115,255,84,151,86,130,255,96]:[135,128,128,128,128,128,130,124];return {table:rows.length?`<table class="results-table ${machine?'machine-table':'case-table'}" id="rTable"><caption>${machine?'机评执行记录':'Case 样本评测结果'}</caption><colgroup>${widths.map(w=>`<col style="width:${w}px">`).join('')}</colgroup><thead><tr>${headers.map((h,i)=>`<th scope="col" class="${i===headers.length-1?'result-action-cell':''}">${machine&&i===0?'<input type="checkbox" id="rSelectAll" aria-label="选择本页全部机评记录">':esc(h)}</th>`).join('')}</tr></thead><tbody>${current.map(r=>machine?machineRowHTML(r,state):caseRowHTML(r)).join('')}</tbody></table>`:`<div class="result-empty"><strong>暂无符合条件的记录</strong><p>请调整筛选条件，或等待当前任务完成评测。</p><button class="btn" id="rEmptyReset">清空筛选</button></div>`,footer:`<span>共 ${rows.length} 条模拟记录${rows.length?` · 第 ${(state.page-1)*state.size+1}–${Math.min(state.page*state.size,rows.length)} 条`:''}</span><div class="pagination"><label class="sr-only" for="rSize">每页记录数</label><select class="input" id="rSize">${[10,20,50].map(n=>`<option value="${n}" ${state.size===n?'selected':''}>${n} 条/页</option>`).join('')}</select><button class="page-btn" data-r-page="${state.page-1}" ${state.page===1?'disabled':''} aria-label="上一页">${icon('arrow')}</button>${Array.from({length:max},(_,i)=>`<button class="page-btn ${state.page===i+1?'selected':''}" data-r-page="${i+1}" ${state.page===i+1?'aria-current="page"':''}>${i+1}</button>`).join('')}<button class="page-btn" data-r-page="${state.page+1}" ${state.page===max?'disabled':''} aria-label="下一页"><svg class="icon" aria-hidden="true" style="transform:rotate(180deg)"><use href="#i-arrow"/></svg></button></div>`}}
function syncResultSelection(){const v=resultView();if(!v||!$('rSelectAll'))return;const current=filteredResultRecords(v.records,v.state,v.route.tab).slice((v.state.page-1)*v.state.size,v.state.page*v.state.size);$('rSelectAll').checked=current.length>0&&current.every(r=>v.state.selected.has(r.id));$('rSelectAll').indeterminate=current.some(r=>v.state.selected.has(r.id))&&!$('rSelectAll').checked;$('rSelectionCount').textContent=v.state.selected.size?`已选 ${v.state.selected.size} 条`:''}
function renderResultTable(focusId=null){const v=resultView();if(!v||!$('rScroll'))return;closeResultMenu(false);const x=$('rScroll').scrollLeft,y=$('rScroll').scrollTop;const html=resultsTableHTML(v.records,v.state,v.route.tab);$('rScroll').innerHTML=html.table;$('rFooter').innerHTML=html.footer;$('rScroll').scrollLeft=x;$('rScroll').scrollTop=y;syncResultSelection();if(focusId)$(focusId)?.focus({preventScroll:true})}
function saveResultFilter(){const v=resultView();if(!v)return;const s=v.state;if($('rHuman'))s.human=$('rHuman').value;if($('rConclusion'))s.conclusion=$('rConclusion').value;if($('rStatus'))s.status=$('rStatus').value;if($('rQuery'))s.query=$('rQuery').value}
function applyResultFilter(){const v=resultView();if(!v)return;saveResultFilter();v.state.applied={human:v.state.human,conclusion:v.state.conclusion,status:v.state.status,query:v.state.query};v.state.page=1;renderResultTable();$('live').textContent=`查询完成，共 ${filteredResultRecords(v.records,v.state,v.route.tab).length} 条模拟记录`}
function resetResultFilter(){const v=resultView();if(!v)return;Object.assign(v.state,{human:'',conclusion:'',status:'',query:'',applied:{human:'',conclusion:'',status:'',query:''},page:1});['rHuman','rConclusion','rStatus','rQuery'].forEach(id=>{if($(id))$(id).value=''});renderResultTable();($('rHuman')||$('rQuery'))?.focus({preventScroll:true})}
function currentRecord(id){const v=resultView();return v?.records.find(r=>r.id===id)||null}
function openRecordEvidence(id,kind='case'){const r=currentRecord(id);if(!r)return;closeResultMenu(true);const f=recordFacts(r);const history=r.attempts.map(a=>`<div class="evidence-round"><div class="evidence-round-title">Attempt ${a.number}${technicalPill(a.number===r.attempt?f.machine:'success')}</div><p>${esc(a.reason)}</p></div>`).join('');const rounds=Array.from({length:f.machine==='success'?r.rounds:0},(_,i)=>`<div class="evidence-round"><div class="evidence-round-title">第 ${i+1} / ${r.rounds} 轮<span class="result-pill ${f.machine==='success'?'green':''}">${f.machine==='success'?'成功':'未完成'}</span></div><p>用户请求：${esc(i?r.query+'（延续历史约束）':r.query)}\nAgent 回复：${esc(f.tested==='success'?r.answer:'暂无可用 Agent 回复（被测执行未完成或失败）。')}\n评测依据：${esc(f.c.rule.name)} · ${esc(f.c.rule.version)}；检查需求承接、推荐依据与对话一致性。</p></div>`).join('');openModal(kind==='trace'?'Trace 详情（模拟）':kind==='rounds'?'逐轮证据':'Case 评测证据',`<div class="evidence-view"><div class="evidence-intro"><div class="evidence-meta">记录 ID ${r.id} · 执行 ID ${r.executionId}<br>所属子任务：${esc(f.c.name)}<br>数据集：${esc(f.c.dataset.name)}<br>Trace：${esc(r.trace)}<div class="evidence-outcome">${technicalPill(f.machine)}${conclusionPill(f.conclusion)}${humanPill(f.human)}<span>最终分 ${f.score===null?'—':f.score.toFixed(6)}</span></div></div><span class="demo-tag">模拟证据</span></div>${kind==='rounds'?rounds:`<section class="evidence-section"><h3>用户请求</h3><p>${esc(r.query)}</p></section><section class="evidence-section"><h3>Agent 回复</h3><p>${esc(f.tested==='success'?r.answer:'暂无可用 Agent 回复（被测执行未完成或失败）。')}</p></section><section class="evidence-section"><h3>评测依据</h3><p>规则：${esc(f.c.rule.name)} · ${esc(f.c.rule.version)}\n机器结论：${f.conclusion==='pass'?'通过':f.conclusion==='fail'?'未通过':'不确定'}\n${f.machine==='success'?'模拟执行完成；分数与结论为独立示例，不定义正式业务阈值。':'当前执行未完成或失败，暂无可用最终评分。'}</p></section>${kind==='trace'?rounds:''}`}<section class="evidence-section"><h3>机评 Attempt 历史</h3><div style="padding:0 15px">${history}</div></section><p class="evidence-foot">当前证据仅为本地模拟，不读取真实 Trace，不包含任何凭证。重评样本不改变任务汇总分或已发布报告。</p></div>`)}
function ensureResultMenu(){if($('resultActionMenu'))return;const menu=document.createElement('div');menu.id='resultActionMenu';menu.className='result-menu';menu.hidden=true;menu.setAttribute('role','menu');menu.setAttribute('aria-label','机评记录操作');document.body.append(menu);menu.addEventListener('click',e=>{const b=e.target.closest('[data-r-menu-action]');if(!b||b.disabled)return;const id=resultMenuRecord,action=b.dataset.rMenuAction;closeResultMenu(true);if(action==='rounds')openRecordEvidence(id,'rounds');else rerateRecord(id)});menu.addEventListener('keydown',e=>{const values=[...menu.querySelectorAll('button:not(:disabled)')];if(['ArrowDown','ArrowUp','Home','End'].includes(e.key)){e.preventDefault();let i=values.indexOf(document.activeElement);i=e.key==='Home'?0:e.key==='End'?values.length-1:(i+(e.key==='ArrowDown'?1:-1)+values.length)%values.length;values[i]?.focus()}if(e.key==='Escape'){e.preventDefault();closeResultMenu(true)}if(e.key==='Tab')closeResultMenu(true)})}
function openResultMenu(trigger,id){const r=currentRecord(id);if(!r)return;ensureResultMenu();if(resultMenuRecord===id&&!$('resultActionMenu').hidden){closeResultMenu(true);return}closeResultMenu(false);resultMenuRecord=id;resultMenuTrigger=trigger;trigger.setAttribute('aria-expanded','true');const f=recordFacts(r),menu=$('resultActionMenu');menu.innerHTML=`<button role="menuitem" data-r-menu-action="rounds" tabindex="-1">逐轮证据</button><button role="menuitem" data-r-menu-action="rerate" tabindex="-1" ${r.rerunning||f.tested!=='success'?'disabled':''}>${r.rerunning?'重评中':'重评机评'}</button>`;menu.hidden=false;const rect=trigger.getBoundingClientRect(),height=menu.offsetHeight;menu.style.left=Math.max(8,Math.min(window.innerWidth-146,rect.right-138))+'px';menu.style.top=(rect.bottom+height+10>window.innerHeight?Math.max(8,rect.top-height-6):rect.bottom+5)+'px';menu.querySelector('button:not(:disabled)')?.focus()}
function closeResultMenu(restore=false){const menu=$('resultActionMenu');if(menu)menu.hidden=true;resultMenuTrigger?.setAttribute('aria-expanded','false');if(restore&&resultMenuTrigger&&document.contains(resultMenuTrigger))resultMenuTrigger.focus({preventScroll:true});resultMenuTrigger=null;resultMenuRecord=null}
function rerateRecord(id){const r=currentRecord(id);if(!r||r.rerunning||recordFacts(r).tested!=='success')return;r.rerunning=true;r.attempt++;r.attempts.push({number:r.attempt,reason:'用户发起模拟重评机评，仅复用当前样本已有 Agent 回复。'});renderResultTable('rScroll');notify(`记录 ${r.id} 正在模拟重评机评。`);setTimeout(()=>{r.rerunning=false;r.ratedAgain=true;r.duration=9.8;if(currentRecord(r.id)){if($('modalMask').hidden)renderResultTable('rScroll');else deferredResultRefresh=true}notify(`记录 ${r.id} 模拟重评完成；任务汇总分及报告保持不变。`)},1300)}
$('main').addEventListener('submit',e=>{if(e.target.id==='rFilterForm'){e.preventDefault();applyResultFilter()}});
$('main').addEventListener('input',e=>{if(e.target.closest('#rFilterForm'))saveResultFilter()});
$('main').addEventListener('change',e=>{const v=resultView();if(!v)return;if(e.target.closest('#rFilterForm'))saveResultFilter();if(e.target.id==='rSize'){v.state.size=Number(e.target.value);v.state.page=1;renderResultTable('rSize')}if(e.target.dataset.rSelect){const id=e.target.dataset.rSelect;if(e.target.checked)v.state.selected.add(id);else v.state.selected.delete(id);syncResultSelection()}if(e.target.id==='rSelectAll'){const current=filteredResultRecords(v.records,v.state,v.route.tab).slice((v.state.page-1)*v.state.size,v.state.page*v.state.size);current.forEach(r=>e.target.checked?v.state.selected.add(r.id):v.state.selected.delete(r.id));renderResultTable('rSelectAll')}});
$('main').addEventListener('click',e=>{const v=resultView();if(!v)return;const proof=e.target.closest('[data-r-evidence]'),trace=e.target.closest('[data-r-trace]'),menu=e.target.closest('[data-r-menu]'),pager=e.target.closest('[data-r-page]');if(proof){openRecordEvidence(proof.dataset.rEvidence);return}if(trace){openRecordEvidence(trace.dataset.rTrace,'trace');return}if(menu){openResultMenu(menu,menu.dataset.rMenu);return}if(pager&&!pager.disabled){v.state.page=Number(pager.dataset.rPage);renderResultTable();document.querySelector('.results-footer .page-btn.selected')?.focus({preventScroll:true});$('rScroll').scrollTop=0;return}if(e.target.closest('#rReset')||e.target.closest('#rEmptyReset'))resetResultFilter();if(e.target.closest('#rRefresh')){renderResultTable('rRefresh');notify('样本结果已刷新，当前为模拟数据。')}});
document.addEventListener('click',e=>{if(!e.target.closest('#resultActionMenu')&&!e.target.closest('[data-r-menu]'))closeResultMenu(false)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('resultActionMenu')&&!$('resultActionMenu').hidden)closeResultMenu(true)});
window.addEventListener('resize',()=>closeResultMenu(false));
$('main').addEventListener('scroll',e=>{if(e.target.id==='rScroll'){const v=resultView();if(v){v.state.x=e.target.scrollLeft;v.state.y=e.target.scrollTop}closeResultMenu(false)}},true);
ensureResultMenu();
if(!location.hash)history.replaceState(null,'','#/tasks');renderRoute(false);
</script>
